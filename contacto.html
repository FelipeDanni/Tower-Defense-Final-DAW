<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tower Defense</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="contenedor-juego">
        <div id="pantalla-contacto">
            <h2>Transmisión al Cuartel General</h2>
            <form id="formulario-contacto">
                <label for="contacto-nombre">Comandante (Solo letras y números):</label>
                <input type="text" id="contacto-nombre" autocomplete="off">
                <label for="contacto-email">Correo Electrónico:</label>
                <input type="text" id="contacto-email" autocomplete="off">
                <label for="contacto-mensaje">Reporte (Mínimo 5 caracteres):</label>
                <textarea id="contacto-mensaje" rows="4"></textarea>
                <button type="submit" id="btn-enviar">Enviar Reporte</button>
            </form>
            <p id="mensaje-error-contacto" class="oculto"></p>
            <a href="index.html" class="enlace-volver">Volver a la Base (Juego)</a>
        </div>
    </div>
    <script src="js/contacto.js"></script>
</body>
</html>
